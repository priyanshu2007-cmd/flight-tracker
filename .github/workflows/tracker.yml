name: tracker

on:
  schedule:
    - cron: "3 * * * *"  # hourly; GitHub may delay scheduled runs by several minutes
    - cron: "45 21,2,7,12,17 * * *"  # status email every 5 h: 03:15, 08:15, 13:15, 18:15, 23:15 IST
  workflow_dispatch:
    inputs:
      command:
        description: "tracker command"
        required: true
        default: check
        type: choice
        options: [check, "check --dry-run", status-email, trial-start, test-email, simulate-drop, summary, flush]

concurrency:
  group: tracker  # never two runs at once; queued runs wait instead of being cancelled
  cancel-in-progress: false

permissions:
  contents: write  # save the database to the `data` branch
  actions: write   # disable this workflow when the trial ends

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # a dry-run probe uses a throwaway DB so it can never swallow a real alert
      TRACKER_DB: ${{ contains(github.event.inputs.command, 'dry-run') && 'data/probe.db' || 'data/tracker.db' }}
      REQUIRE_TRIAL: ${{ github.event_name == 'schedule' && '1' || '0' }}  # scheduled checks idle until trial-start
      MAX_BOOKING_LOOKUPS: "1"  # keeps the trial inside SerpApi's free 250 searches/month
      GMAIL_TOKEN_FILE: secrets/gmail_token.json
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev --frozen

      - name: Restore database
        run: |
          mkdir -p data
          if git fetch -q origin data; then git show origin/data:tracker.db > data/tracker.db; fi

      - name: Write Gmail token
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          umask 077 && mkdir -p secrets
          [ -n "$GMAIL_TOKEN_JSON" ] && printf '%s' "$GMAIL_TOKEN_JSON" > "$GMAIL_TOKEN_FILE" || echo "no Gmail token secret"

      - name: Run tracker
        run: |
          uv run python -m tracker ${{ github.event.schedule == '45 21,2,7,12,17 * * *' && 'status-email' || github.event.inputs.command || 'check' }}
          case "$TRACKER_DB" in *probe.db) uv run python -m tracker summary ;; esac

      - name: Save database
        if: always()
        run: |
          [ -f data/tracker.db ] || exit 0
          [ "$TRACKER_DB" = data/tracker.db ] || exit 0  # never save a probe DB
          uv run python -c "import sqlite3; sqlite3.connect('data/tracker.db').execute('PRAGMA wal_checkpoint(TRUNCATE)')"
          mkdir -p /tmp/db && cp data/tracker.db /tmp/db/ && cd /tmp/db
          git init -q -b data && git add tracker.db
          git -c user.name=tracker -c user.email=tracker@users.noreply.github.com commit -qm "db $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Backup database
        if: always() && hashFiles('data/tracker.db') != '' && !contains(github.event.inputs.command, 'dry-run')
        uses: actions/upload-artifact@v4
        with:
          name: tracker-db-${{ github.run_id }}
          path: data/tracker.db
          retention-days: 30  # the data branch keeps only the latest copy; these keep a month of snapshots

      - name: Stop schedule after trial
        if: always()
        run: |
          if uv run python -m tracker summary | grep -q '^Trial: completed'; then
            gh workflow disable tracker.yml -R "$GITHUB_REPOSITORY" && echo "trial completed: schedule disabled"
          fi
